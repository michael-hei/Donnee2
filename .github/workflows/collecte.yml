name: collecte-aqi-horaire

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecte (raw/)
        run: python scripts/collecte.py
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}

      - name: Reconstruction de clean/
        run: python scripts/build_clean.py

      - name: Validation du contrat de données
        run: python scripts/validate_clean.py

      - name: Chargement du warehouse
        run: python scripts/load_warehouse.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit des fichiers raw/ et clean/
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "aqi-pipeline-bot@users.noreply.github.com"
          git add raw/ clean/
          git diff --cached --quiet || git commit -m "collecte automatique $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push